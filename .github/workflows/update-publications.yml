name: Check publications

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-publications.yml'
      - 'scripts/update_publications.py'
  schedule:
    # 09:00 Europe/Oslo (GitHub timezone-aware schedule).
    - cron: '0 9 * * 1'
      timezone: 'Europe/Oslo'

permissions:
  contents: write
  pull-requests: write
  pages: write

concurrency:
  group: publication-check
  cancel-in-progress: false

jobs:
  check-publications:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google Scholar HTML parser
        run: python -m pip install beautifulsoup4==4.14.2
      - name: Check Python syntax
        run: python -m py_compile scripts/update_publications.py
      - name: Query Google Scholar profile and enrich metadata via Crossref
        run: python scripts/update_publications.py
      - name: Propose changes for review
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'Check publication metadata'
          branch: automation/publications
          delete-branch: true
          title: 'Publish verified Google Scholar publications'
          body: |
            Verified against the explicitly configured Google Scholar author profile:
            https://scholar.google.com/citations?user=KqmBkNoAAAAJ

            New publications found on that profile are automatically added;
            Crossref enriches verified records with DOI and journal metadata.
            Auto-merge is enabled. If Scholar access fails, this workflow fails closed.
          add-paths: |
            recent_research.html
      - name: Merge verified metadata changes automatically
        id: automerge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          echo 'merged=true' >> "$GITHUB_OUTPUT"
      - name: Request GitHub Pages rebuild
        if: steps.automerge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Merges made by GITHUB_TOKEN do not automatically trigger a Pages build.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
