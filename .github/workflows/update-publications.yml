name: Check publications

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-publications.yml'
      - 'scripts/update_publications.py'
      - 'tests/test_publication_checker.py'
  schedule:
    # 09:00 Europe/Oslo (GitHub timezone-aware schedule).
    - cron: '0 9 * * 1'
      timezone: 'Europe/Oslo'

permissions:
  contents: write
  pull-requests: write
  pages: write

concurrency:
  group: publication-check
  cancel-in-progress: false

jobs:
  check-publications:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile scripts/update_publications.py
      - name: Test author and research-area matching
        run: python -m unittest discover -s tests -v
      - name: Query Crossref and update verified publications
        run: python scripts/update_publications.py
      - name: Propose changes for review
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'Check publication metadata'
          branch: automation/publications
          delete-branch: true
          title: 'Publish verified Crossref publications'
          body: |
            Crossref searches for the exact Youkai Wu author name.
            New papers must also match trusted research areas (operations research,
            optimization, logistics, transportation), confirmed coauthors,
            or Sichuan University/Norwegian research affiliations.
            The automated checks run before auto-merging updates.
          add-paths: |
            recent_research.html
      - name: Merge verified metadata changes automatically
        id: automerge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          echo 'merged=true' >> "$GITHUB_OUTPUT"
      - name: Request GitHub Pages rebuild
        if: steps.automerge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Merges made by GITHUB_TOKEN do not automatically trigger a Pages build.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
